name: Materialize email signature JPEG
on:
  push:
    paths:
      - 'logos/methodz/signature-b64/**'
      - '.github/workflows/materialize-signature.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode chunks into the canonical JPEG
        run: |
          set -euo pipefail
          mkdir -p logos/methodz
          cat logos/methodz/signature-b64/part-*.b64 | base64 -d > logos/methodz/charles-stenerson-email-signature.jpg
          file logos/methodz/charles-stenerson-email-signature.jpg
          git config user.name "methodz-brand-assets"
          git config user.email "zidthesunkid@gmail.com"
          git add logos/methodz/charles-stenerson-email-signature.jpg
          if git diff --cached --quiet; then
            echo "JPEG already current"
            exit 0
          fi
          git commit -m "Publish Charles Stenerson email signature JPEG"
          git push
