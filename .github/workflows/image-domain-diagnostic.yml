name: image.methodz.ca diagnostic

on:
  push:
    branches:
      - ops/image-domain-diagnostic-33845848

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: DNS, TLS and HTTP proof
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          echo 'CNAME:'
          dig +short CNAME image.methodz.ca
          echo 'A:'
          dig +short A image.methodz.ca
          echo 'AAAA:'
          dig +short AAAA image.methodz.ca
          echo 'METHODZ_NS:'
          dig +short NS methodz.ca
          echo 'CAA:'
          dig +short CAA image.methodz.ca

          echo '=== TLS ==='
          timeout 20 bash -c "echo | openssl s_client -connect image.methodz.ca:443 -servername image.methodz.ca 2>/tmp/image-tls.err | openssl x509 -noout -subject -issuer -dates -ext subjectAltName"
          TLS_RC=$?
          echo "TLS_RC=$TLS_RC"
          cat /tmp/image-tls.err || true

          probe() {
            label="$1"
            url="$2"
            outfile="$3"
            echo "--- $label $url"
            curl -sS -L --max-time 25 -D "/tmp/${label}.headers" -o "$outfile" -w "${label}_STATUS=%{http_code} ${label}_FINAL=%{url_effective} ${label}_REMOTE=%{remote_ip}\n" "$url"
            rc=$?
            echo "${label}_CURL_RC=$rc"
            sed -n '1,20p' "/tmp/${label}.headers" 2>/dev/null || true
          }

          echo '=== CANONICAL HTTP ==='
          probe ROOT 'https://image.methodz.ca/' /tmp/root.body
          probe MANIFEST 'https://image.methodz.ca/api/v1/manifest.json' /tmp/manifest.body
          probe ASSET_META 'https://image.methodz.ca/api/v1/assets/methodz/main-logo-transparent.json' /tmp/asset-meta.body
          probe ASSET_RAW 'https://image.methodz.ca/logos/methodz/main-logo-transparent.png' /tmp/asset.png
          probe HTTP_ROOT 'http://image.methodz.ca/' /tmp/http-root.body

          echo '=== BODY IDENTIFIERS ==='
          head -c 500 /tmp/root.body 2>/dev/null || true
          echo
          head -c 500 /tmp/manifest.body 2>/dev/null || true
          echo
          head -c 500 /tmp/asset-meta.body 2>/dev/null || true
          echo
          file /tmp/asset.png 2>/dev/null || true

          echo '=== DEFAULT GITHUB PAGES ORIGIN ==='
          probe GH_ROOT 'https://ziddi3.github.io/methodz-brand-assets/' /tmp/gh-root.body
          probe GH_MANIFEST 'https://ziddi3.github.io/methodz-brand-assets/api/v1/manifest.json' /tmp/gh-manifest.body

          echo '=== GITHUB PAGES EDGE BYPASS ==='
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            echo "EDGE=$ip"
            curl -sS --max-time 20 --resolve "image.methodz.ca:443:${ip}" -o /dev/null -w "EDGE_${ip}_STATUS=%{http_code} EDGE_${ip}_REMOTE=%{remote_ip}\n" 'https://image.methodz.ca/api/v1/manifest.json'
            echo "EDGE_${ip}_RC=$?"
          done
